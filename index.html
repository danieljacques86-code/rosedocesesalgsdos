<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Doces e Salgados</title>

<style>
body{
font-family:Arial;
background:#fff5f8;
margin:0;
}

header{
background:#d90429;
color:white;
padding:20px;
text-align:center;
}

.produto{
background:white;
margin:15px;
padding:15px;
border-radius:10px;
box-shadow:0 0 8px #ccc;
}

button{
background:#d90429;
color:white;
border:0;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:10px;
}

#carrinho{
background:white;
padding:20px;
margin:15px;
border-radius:10px;
}

.total{
font-size:22px;
font-weight:bold;
}

.pix{
background:#00a86b;
color:white;
padding:15px;
margin:15px;
border-radius:10px;
}
</style>

</head>

<body>

<header>
<h1>🍩 Rose Doces e Salgados</h1>
<p>Faça seu pedido online</p>
</header>


<div class="produto">
<h3>Rosquinha Chocolate</h3>
<p>R$ 7,00</p>
<button onclick="add('Rosquinha Chocolate',7)">
Adicionar
</button>
</div>


<div class="produto">
<h3>Coxinha</h3>
<p>R$ 6,00</p>
<button onclick="add('Coxinha',6)">
Adicionar
</button>
</div>


<div class="produto">
<h3>Pizza Calabresa</h3>
<p>R$ 35,00</p>
<button onclick="add('Pizza Calabresa',35)">
Adicionar
</button>
</div>



<div id="carrinho">

<h2>🛒 Seu Pedido</h2>

<div id="lista">
Nenhum produto
</div>

<p class="total">
Total: R$ <span id="total">0</span>
</p>


<button onclick="copiarPix()">
📋 Copiar PIX
</button>


<button onclick="enviarWhats()">
✅ Já paguei - Enviar Pedido
</button>

</div>



<div class="pix">

<h3>PIX</h3>

<p>
Chave PIX:
<b>47999117547</b>
</p>

<p>
Após pagar clique em "Já paguei"
</p>

</div>



<script>

let pedido=[];
let total=0;


function add(nome,valor){

pedido.push(nome);
total += valor;

mostrar();

}


function mostrar(){

let texto="";

pedido.forEach((item)=>{
texto += "✔ "+item+"<br>";
});


document.getElementById("lista").innerHTML=texto;

document.getElementById("total").innerHTML=
total.toFixed(2);

}



function copiarPix(){

navigator.clipboard.writeText(
"47999117547"
);

alert("PIX copiado!");

}



function enviarWhats(){

let mensagem=
"🍩 Rose Doces e Salgados%0A%0A"+
"Pedido:%0A"+
pedido.join("%0A")+
"%0A%0ATotal: R$ "+
total.toFixed(2)+
"%0A%0APIX: 47999117547";


window.open(
"https://wa.me/5547999117547?text="+mensagem
);

}


</script>


</body>
</html>
